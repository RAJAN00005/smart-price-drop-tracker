<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sonam Quartz Luxury Gear Wall Clock : Amazon.in</title>
  <meta property="og:title" content="Sonam Quartz Luxury Gear Wall Clock">
  <meta property="og:image" content="https://m.media-amazon.com/images/I/mock-clock.jpg">
  <link rel="canonical" href="https://www.amazon.in/dp/B0LIVELAYOUT">
  <style>
    /* Mirrors the live Amazon accessibility pattern: .a-offscreen carries the
       price text but is visually hidden with opacity: 0. */
    .a-offscreen { position: absolute; opacity: 0; pointer-events: none; }
    .aok-offscreen { position: absolute; opacity: 0; }
    .a-price { display: inline-flex; align-items: baseline; }
    .a-price-symbol { font-size: 13px; }
    .a-price-whole { font-size: 28px; }
    .a-price-fraction { font-size: 13px; }
  </style>
</head>
<body>
  <main id="centerCol">
    <h1 id="productTitle">Sonam Quartz Luxury Gear Wall Clock</h1>
    <div id="corePrice_feature_div" class="celwidget">
      <span class="a-price aok-align-center apex-pricetopay-value">
        <span class="a-offscreen">₹1,999.00</span>
        <span aria-hidden="true">₹1,999.00</span>
      </span>
    </div>
    <div id="corePriceDisplay_desktop_feature_div">
      <span class="a-price aok-align-center reinventPricePriceToPayMargin priceToPay apex-pricetopay-value">
        <span class="a-offscreen"></span>
        <span aria-hidden="true">
          <span class="a-price-symbol">₹</span>
          <span class="a-price-whole">1,999<span class="a-price-decimal">.</span></span>
          <span class="a-price-fraction">00</span>
        </span>
      </span>
      <span class="apex-basisprice-feature">
        <span class="aok-relative">
          <span data-basisprice-label="{label} {price}" class="a-size-small aok-offscreen apex-basisprice-offscreen-label">M.R.P.: ₹2,799.00</span>
          <span aria-hidden="true" class="a-size-small a-color-secondary basisPrice">
            <span class="apex-basisprice-label">M.R.P.:</span>
            <span class="a-price a-text-price apex-basisprice-value" data-a-strike="true">
              <span class="a-offscreen">₹2,799</span>
              <span aria-hidden="true">₹2,799</span>
            </span>
          </span>
        </span>
      </span>
    </div>
    <div id="availability">In stock</div>
    <button>Add to Cart</button>
    <img id="landingImage" src="https://m.media-amazon.com/images/I/mock-clock.jpg" width="400" height="400" alt="Wall clock">
  </main>
</body>
</html>
