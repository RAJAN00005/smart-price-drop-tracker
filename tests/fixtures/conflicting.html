<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Conflicting Price Product : Amazon.in</title>
  <meta property="og:title" content="Conflicting Price Product">
  <meta property="og:image" content="https://m.media-amazon.com/images/I/mock-conflict.jpg">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Conflicting Price Product",
    "image": "https://m.media-amazon.com/images/I/mock-conflict.jpg",
    "offers": {
      "@type": "Offer",
      "price": "119999",
      "priceCurrency": "INR",
      "availability": "https://schema.org/InStock"
    }
  }
  </script>
</head>
<body>
  <main id="centerCol">
    <h1 id="productTitle">Conflicting Price Product</h1>
    <span id="priceblock_dealprice">₹1,25,999</span>
    <div id="availability">In stock</div>
    <button>Add to Cart</button>
    <img id="landingImage" src="https://m.media-amazon.com/images/I/mock-conflict.jpg" width="400" height="400" alt="product">
  </main>
</body>
</html>
